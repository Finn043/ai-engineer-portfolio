  <text x="760" y="516" fill="#929da5" font-family="Arial,sans-serif" font-size="17">CloudWatch logs · IAM roles · least privilege</text>
  <rect x="68" y="612" width="10" height="10" rx="5" fill="url(#aws)"/><text x="91" y="622" fill="#aa9e91" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">ARCHITECTURE PROPOSAL · TEAM REPORT</text>
</svg>
